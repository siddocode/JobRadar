name: Scheduled Job Ingestion

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab anytime

jobs:
  collect-jobs:
    name: Collect & Sync Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI || secrets.MONGO_DB_URI || secrets.MONGODB_URL || secrets.DATABASE_URL || secrets.DATABASE_URI || secrets.MONGODB_CONNECTION_STRING || vars.MONGODB_URI || vars.MONGO_URI || vars.MONGO_DB_URI || vars.MONGODB_URL || vars.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Verify Database Secret
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error title=Missing Secret::MongoDB connection URI is missing from GitHub Secrets! Go to Settings -> Secrets and variables -> Actions and add 'MONGODB_URI' under 'Repository secrets'."
            echo ""
            echo "================================================================="
            echo "CRITICAL: Why this failed even if you already added it:"
            echo "1. ENVIRONMENT SECRETS vs REPOSITORY SECRETS:"
            echo "   If you added the secret inside an 'Environment' (e.g. production),"
            echo "   GitHub blocks it because this workflow is not linked to an environment."
            echo "   -> It MUST be under 'Repository secrets' at the bottom of the page!"
            echo "2. URL TO ADD SECRET:"
            echo "   https://github.com/siddocode/JobRadar/settings/secrets/actions"
            echo "3. CLICK 'New repository secret':"
            echo "   Name:  MONGODB_URI"
            echo "   Value: mongodb+srv://... (from backend/.env)"
            echo "4. RUN WORKFLOW:"
            echo "   After saving, you must click 'Run workflow' in the Actions tab!"
            echo "================================================================="
            exit 1
          fi
          echo "Database configuration secret detected (${#MONGODB_URI} chars)."

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Test Database Connectivity
        run: |
          cd backend
          node -e "
            const dns = require('dns');
            try { dns.setDefaultResultOrder('ipv4first'); } catch (_) {}
            const mongoose = require('mongoose');
            const uri = process.env.MONGODB_URI;
            const masked = uri.replace(/\/\/([^:]+):([^@]+)@/, '//***:***@');
            console.log('[Test DB] Connecting to ' + masked + '...');
            mongoose.connect(uri, { serverSelectionTimeoutMS: 20000, family: 4 })
              .then(async () => {
                console.log('[Test DB] Successfully connected to MongoDB Atlas!');
                await mongoose.disconnect();
                process.exit(0);
              })
              .catch(err => {
                console.error('::error title=MongoDB Atlas Connection Failed::' + err.message);
                console.error('');
                console.error('=================================================================');
                console.error('CRITICAL: MongoDB Atlas blocked this GitHub Actions runner IP!');
                console.error('GitHub Actions runners use dynamic cloud IPs.');
                console.error('Fix in MongoDB Atlas:');
                console.error('1. Go to https://cloud.mongodb.com/');
                console.error('2. Navigate to Security -> Network Access');
                console.error('3. Click Add IP Address -> Select \"Allow Access From Anywhere\" (0.0.0.0/0)');
                console.error('4. Click Confirm');
                console.error('=================================================================');
                process.exit(1);
              });
          "

      - name: Run JobRadar Collection
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          cd backend
          npm run collect
