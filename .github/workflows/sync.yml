name: Scheduled Job Ingestion

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab anytime

jobs:
  collect-jobs:
    name: Collect & Sync Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Verify Database Secret
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error title=Missing Secret::MONGODB_URI secret is missing in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions and add MONGODB_URI."
            exit 1
          fi
          echo "Database configuration secret detected."

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run JobRadar Collection
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          cd backend
          npm run collect
